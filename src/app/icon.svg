<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Vibrant Violet-Indigo Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="45%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Specular Highlight for Glass Feel -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#c4b5fd" stop-opacity="0.15" />
    </linearGradient>

    <!-- Shadow for Needle -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="124" fill="url(#glossGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="118" fill="none" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Navigation Compass Coordinate Ring (Subtle) -->
  <circle cx="256" cy="270" r="148" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.25" />
  <circle cx="256" cy="270" r="168" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.12" />

  <!-- Emblem Group with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Left Wing of W -->
    <path d="M 112 216 L 158 376 L 208 280 L 172 280 L 144 336 L 128 216 Z" fill="#ffffff" opacity="0.95" />
    
    <!-- Right Wing of W -->
    <path d="M 400 216 L 354 376 L 304 280 L 340 280 L 368 336 L 384 216 Z" fill="#c7d2fe" opacity="0.95" />

    <!-- Center Navigation Needle (WayPoint Compass Arrow) -->
    <!-- Left Facet (Lighted pure white) -->
    <path d="M 256 102 L 186 352 L 256 304 Z" fill="#ffffff" />
    <!-- Right Facet (Shaded luminous lavender) -->
    <path d="M 256 102 L 326 352 L 256 304 Z" fill="#c7d2fe" />

    <!-- Central Centerline Spine -->
    <line x1="256" y1="102" x2="256" y2="304" stroke="#ffffff" stroke-width="2.5" opacity="0.85" />

    <!-- WayPoint Core Radar Beacon Dot -->
    <circle cx="256" cy="304" r="16" fill="#ffffff" />
    <circle cx="256" cy="304" r="24" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5" />
    <circle cx="256" cy="304" r="8" fill="#6366f1" />
  </g>
</svg>